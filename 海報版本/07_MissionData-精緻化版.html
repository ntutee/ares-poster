<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>絕地救援・赤境計畫｜2027 北科電機冬令營</title>
<!--
  構圖：左上主標 → 留白 → 左中 Mission Data（黑色天空）→ 視線落到火星、基地、太空人。
  地景（y > 104cqw）保持乾淨，不放活動資訊。
  海報比例 2:3（同底圖 630×945），尺寸單位 cqw＝海報寬度 1%（寬 100 × 高 150）。
  背景座標參考：火星≈x79 y31｜地平線≈y105｜基地天線頂端≈x72 y103.5｜太空人≈x83–87 y125–135

  印刷閱讀層級（以 A2 寬 42cm 計，1cqw ≈ 4.2mm）：
    3–5 m ：絕地救援（12.6cqw）／2027 NTUT EE CAMP（2.35cqw）／營期日期（6.2cqw）
    1–2 m ：地點／報名時間／對象（2.75cqw）
    近看   ：Mission Data 標籤、Mars 座標、ARES-1（1.1–1.3cqw）

  色彩只用三種：象牙白 --ivory／火星橘紅 --rust／暖灰 --gray（較弱 --gray-2）
  QR：把 .qr 內的 <svg> 換成 <img src="qr.png" alt="報名 QR Code">
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Montserrat:wght@300;400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#ebe3d6;               /* 主資訊：暖象牙白 */
    --rust:#d0603f;                /* 強調：火星橘紅 */
    --gray:#a59b8f;                /* 次要：暖灰 */
    --gray-2:#7d746b;              /* 更弱的暖灰 */
    --hair:rgba(235,227,214,.2);   /* 細線（象牙白低透明） */
    --sans:"Montserrat","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono",Consolas,monospace;
    --tc:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
    --serif:"Noto Serif TC","PMingLiU",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#040203}
  body{display:grid;place-items:center;overflow:hidden}

  .poster{
    position:relative;width:min(100vw, 100vh * 2 / 3);aspect-ratio:2/3;
    container-type:inline-size;overflow:hidden;
    color:var(--ivory);font-family:var(--tc);background:#060304;
  }
  .poster > *{position:absolute}
  .bg{inset:0;width:100%;height:100%;object-fit:cover;display:block}

  .mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.22em}

  /* ===== 角落 ===== */
  .corner-tl{left:7cqw;top:6cqw;font-size:1.5cqw;letter-spacing:.36em;color:var(--gray)}
  .corner-tr{right:7cqw;top:6cqw;text-align:right;font-size:1.2cqw;line-height:1.7;color:var(--gray-2)}
  .corner-tr::after{content:"";display:block;width:1px;height:9cqw;margin:1.6cqw 0 0 auto;background:linear-gradient(var(--hair),transparent)}

  /* ===== 主標 ===== */
  .hero{left:7cqw;top:12.5cqw;width:max-content}
  .hero h1{font-family:var(--serif);font-weight:900;font-size:12.6cqw;line-height:1.03;letter-spacing:.06em;margin-right:-.06em;color:var(--ivory)}
  .hero h1 span{display:block}
  .hero .zh{margin-top:2cqw;font-weight:500;font-size:3.5cqw;line-height:1;letter-spacing:1.09em;margin-right:-1.09em;color:var(--rust)}
  .hero .en{margin-top:1.9cqw;font-family:var(--sans);font-weight:400;font-size:1.68cqw;line-height:1;letter-spacing:.66em;margin-right:-.66em;color:var(--gray)}
  .hero .camp{margin-top:3.8cqw;padding-top:2.8cqw;border-top:1px solid var(--hair)}
  .hero .camp-en{font-family:var(--sans);font-weight:500;font-size:2.35cqw;letter-spacing:.14em;line-height:1;white-space:nowrap}
  .hero .camp-zh{margin-top:1.6cqw;font-weight:400;font-size:2.2cqw;line-height:1;color:var(--gray);text-align:justify;text-align-last:justify}

  /* ===== Mission Data（左中黑色天空） ===== */
  .data{left:7cqw;top:71cqw;width:66cqw}
  .data .head{display:flex;align-items:center;gap:1.6cqw;font-size:1.2cqw;color:var(--gray)}
  .data .head i{flex:1;height:1px;background:var(--hair)}
  .data .head b{font-family:var(--tc);font-weight:500;font-size:1.5cqw;letter-spacing:.3em;text-transform:none;color:var(--rust)}

  .label{display:block;font-family:var(--mono);font-size:1.1cqw;letter-spacing:.22em;text-transform:uppercase;color:var(--gray-2);line-height:1;white-space:nowrap}
  .label em{font-style:normal;color:var(--rust);margin-right:1em}
  .label span{font-family:var(--tc);letter-spacing:.3em;margin-left:.6em;color:var(--gray)}

  .launch{margin-top:2.6cqw;display:flex;align-items:flex-start;justify-content:space-between}
  .launch .date{margin-top:1.5cqw;font-family:var(--sans);font-weight:400;font-size:6.2cqw;letter-spacing:.01em;line-height:.9;white-space:nowrap}
  .launch .date i{font-style:normal;font-weight:300;color:var(--rust);margin:0 .22em}
  .launch .note{margin-top:1.6cqw;font-size:1.6cqw;letter-spacing:.3em;color:var(--gray)}
  .launch .note .y{font-family:var(--sans);letter-spacing:.2em;color:var(--rust);margin-right:.8em}

  .apply{display:flex;flex-direction:column;align-items:center;gap:1.3cqw}
  .qr{width:11.5cqw;aspect-ratio:1;padding:.7cqw;background:var(--ivory)}
  .qr svg,.qr img{display:block;width:100%;height:100%}
  .apply span{font-size:1.4cqw;letter-spacing:.34em;margin-right:-.34em;line-height:1;color:var(--gray)}

  .facts{
    margin-top:2.6cqw;padding-top:2.3cqw;border-top:1px solid var(--hair);
    display:grid;grid-template-columns:40% 27% 33%;
  }
  .facts p{margin-top:1.2cqw;font-weight:500;font-size:2.75cqw;letter-spacing:.06em;line-height:1.15;white-space:nowrap}
  .facts p.num{font-family:var(--sans);font-weight:400;letter-spacing:.01em}
  .facts small{display:block;margin-top:.8cqw;font-size:1.5cqw;letter-spacing:.18em;color:var(--gray-2)}

  /* ===== 世界觀細節：ARES-1（地圖式標註） ===== */
  .ares{left:71.5cqw;top:96cqw;width:20cqw;height:8cqw}
  .ares svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .ares p{position:absolute;left:5.6cqw;top:.6cqw;font-family:var(--mono);text-transform:uppercase;line-height:1.35;white-space:nowrap}
  .ares b{display:block;font-weight:400;font-size:1.05cqw;letter-spacing:.26em;color:var(--gray)}
  .ares span{display:block;font-size:.85cqw;letter-spacing:.22em;color:var(--rust);opacity:.8}
</style>
</head>
<body>
<main class="poster">
  <img class="bg" src="https://raw.githubusercontent.com/ntutee/ares-poster/main/素材/底圖.webp" alt="">

  <!-- 角落 -->
  <p class="corner-tl">國立臺北科技大學 電機工程系</p>
  <p class="corner-tr mono">Mars<br>25.0°N / 226.1°E</p>

  <!-- 主標 -->
  <section class="hero">
    <h1><span>絕地</span><span>救援</span></h1>
    <p class="zh">赤境計畫</p>
    <p class="en">PROJECT ARES</p>
    <div class="camp">
      <p class="camp-en">2027 NTUT EE CAMP</p>
      <p class="camp-zh">北科電機冬令營</p>
    </div>
  </section>

  <!-- Mission Data -->
  <section class="data">
    <div class="head mono">Mission Data<i></i><b>赤境救援先鋒隊 招募中</b></div>

    <div class="launch">
      <div>
        <span class="label"><em>01</em>Launch Window<span>營期</span></span>
        <p class="date">01.25<i>—</i>01.29</p>
        <p class="note"><span class="y">2027</span>MON – FRI　五天四夜</p>
      </div>
      <div class="apply">
        <div class="qr">
          <!-- QR 佔位圖：請換成 <img src="qr.png" alt="報名 QR Code"> -->
          <svg viewBox="0 0 21 21" shape-rendering="crispEdges" aria-label="報名 QR Code">
            <g fill="#140c0a"><path d="M0 0h7v7H0zM14 0h7v7h-7zM0 14h7v7H0z"/></g>
            <g fill="#ebe3d6"><path d="M1 1h5v5H1zM15 1h5v5h-5zM1 15h5v5H1z"/></g>
            <g fill="#140c0a">
              <path d="M2 2h3v3H2zM16 2h3v3h-3zM2 16h3v3H2z"/>
              <path d="M8 0h1v1H8zM10 1h2v1h-2zM9 3h1v2H9zM11 4h2v1h-2zM8 6h1v1H8zM10 6h1v1h-1zM12 6h1v1h-1zM0 8h1v1H0zM2 8h3v1H2zM6 8h2v1H6zM9 8h1v2H9zM12 8h2v1h-2zM15 8h1v1h-1zM17 8h2v1h-2zM20 8h1v2h-1zM1 10h2v1H1zM4 10h1v2H4zM7 10h1v1H7zM11 10h3v1h-3zM16 10h1v2h-1zM18 10h1v1h-1zM0 12h1v1H0zM6 12h3v1H6zM10 12h1v2h-1zM13 12h2v1h-2zM18 12h2v1h-2zM8 14h1v1H8zM12 14h1v1h-1zM14 14h3v1h-3zM19 14h2v1h-2zM9 16h2v1H9zM13 16h1v2h-1zM15 16h1v1h-1zM18 16h1v2h-1zM8 18h1v2H8zM10 18h2v1h-2zM15 18h2v1h-2zM20 18h1v1h-1zM11 20h1v1h-1zM13 20h2v1h-2zM17 20h2v1h-2z"/>
            </g>
          </svg>
        </div>
        <span>掃描報名</span>
      </div>
    </div>

    <div class="facts">
      <div>
        <span class="label"><em>02</em>Base<span>地點</span></span>
        <p>國立臺北科技大學</p>
      </div>
      <div>
        <span class="label"><em>03</em>Enlist<span>報名</span></span>
        <p class="num">11.01 – 11.21</p>
        <small>第一階段</small>
      </div>
      <div>
        <span class="label"><em>04</em>Crew<span>對象</span></span>
        <p>全國高中職學生</p>
        <small>限額 100 名</small>
      </div>
    </div>
  </section>

  <!-- 世界觀細節：基地標註（錨點對準天線頂端 x72 y103.5） -->
  <div class="ares">
    <svg viewBox="0 0 200 80" aria-hidden="true">
      <circle cx="5" cy="75" r="5" fill="none" stroke="#d0603f" stroke-opacity=".7" stroke-width=".6" vector-effect="non-scaling-stroke"/>
      <circle cx="5" cy="75" r="1.4" fill="#d0603f"/>
      <polyline points="9,71 46,40 190,40" fill="none" stroke="#ebe3d6" stroke-opacity=".28" stroke-width=".6" vector-effect="non-scaling-stroke"/>
    </svg>
    <p><b>ARES-1</b><span>Communication lost</span></p>
  </div>
</main>
</body>
</html>
