<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>絕地救援・赤境計畫｜2027 北科電機冬令營</title>
<!--
  方向 A：電影上映型
  上半＝電影主視覺（主標＋留白），下半＝「上映資訊」帶（日期、招募、報名、QR、主辦）。
  海報比例 2:3（同底圖 630×945），尺寸單位 cqw＝海報寬度 1%（寬 100 × 高 150）。
  背景座標參考：火星≈x79 y31｜地平線≈y105｜基地天線≈x72 y104｜太空人≈x83–87 y125–135
  QR：把 .qr 內的 <svg> 換成 <img src="qr.png" alt="報名 QR Code">
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Montserrat:wght@300;400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f1eadf;
    --ink-2:rgba(241,234,223,.78);
    --ink-3:rgba(241,234,223,.5);
    --rust:#c8462e;
    --rust-2:#e27859;
    --hair:rgba(241,234,223,.2);
    --sans:"Montserrat","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono",Consolas,monospace;
    --tc:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#040203}
  body{display:grid;place-items:center;overflow:hidden}

  .poster{
    position:relative;width:min(100vw, 100vh * 2 / 3);aspect-ratio:2/3;
    container-type:inline-size;overflow:hidden;
    color:var(--ink);font-family:var(--tc);background:#060304;
  }
  .poster > *{position:absolute}
  .bg{inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .shade{
    inset:0;pointer-events:none;
    background:
      linear-gradient(to top, rgba(6,3,3,.94) 0%, rgba(6,3,3,.78) 16%, rgba(6,3,3,.35) 27%, rgba(6,3,3,0) 34%),
      linear-gradient(to right, rgba(6,3,3,.35), rgba(6,3,3,0) 60%);
  }
  .grain{
    inset:0;pointer-events:none;opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ===== 左上：品牌 ===== */
  .brand{left:7cqw;top:6.4cqw;display:flex;align-items:center;gap:2cqw}
  .brand svg{width:4.4cqw;height:4.4cqw;flex:none}
  .brand .rule{width:1px;align-self:stretch;background:var(--hair)}
  .brand b{display:block;font-family:var(--sans);font-weight:600;font-size:1.8cqw;letter-spacing:.4em;line-height:1}
  .brand span{display:block;margin-top:.8cqw;font-size:1.35cqw;letter-spacing:.24em;color:var(--ink-3)}

  /* ===== 主視覺：營隊識別 → 主標 → 代號 ===== */
  .hero{left:7cqw;top:21cqw}
  .hero .kicker{
    display:flex;align-items:baseline;gap:1.6cqw;
    font-weight:500;font-size:3.3cqw;letter-spacing:.24em;line-height:1;
  }
  .hero .kicker b{font-family:var(--sans);font-weight:600;color:var(--rust-2);letter-spacing:.08em}
  .hero .kicker small{font-family:var(--sans);font-weight:400;font-size:1.5cqw;letter-spacing:.36em;color:var(--ink-3)}
  .hero h1{
    margin-top:3.4cqw;margin-left:-.6cqw;
    font-weight:900;font-size:15.5cqw;line-height:1.04;letter-spacing:.04em;
    background:linear-gradient(180deg,#f6f0e6 0%,#efe5d6 55%,#e2c9b4 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 .6cqw 2.6cqw rgba(0,0,0,.55));
  }
  .hero h1 span{display:block}
  .hero .codename{margin-top:3.6cqw;display:flex;align-items:center;gap:2.2cqw}
  .hero .codename strong{font-weight:500;font-size:4.4cqw;letter-spacing:.56em;margin-right:-.56em;color:var(--rust-2)}
  .hero .codename i{width:5cqw;height:1px;background:var(--rust);opacity:.8}
  .hero .codename em{font-style:normal;font-family:var(--sans);font-weight:300;font-size:2.1cqw;letter-spacing:.58em;color:var(--ink-2)}

  /* ===== 彩蛋：ARES-1 ===== */
  .ares{left:72cqw;top:89cqw;height:14.5cqw;padding-left:1.6cqw;border-left:1px solid var(--hair);font-family:var(--mono)}
  .ares::before{content:"";position:absolute;left:-.45cqw;bottom:-.45cqw;width:.9cqw;height:.9cqw;border-radius:50%;background:var(--rust);box-shadow:0 0 1.2cqw var(--rust);animation:blink 2.4s steps(1) infinite}
  .ares b{display:block;font-weight:500;font-size:1.35cqw;letter-spacing:.24em;color:var(--ink-2)}
  .ares span{display:block;font-size:1.05cqw;letter-spacing:.2em;color:var(--rust-2);text-transform:uppercase}
  @keyframes blink{50%{opacity:.25}}

  /* ===== 下半：上映資訊帶 ===== */
  .release{left:7cqw;bottom:4.6cqw;width:74cqw}

  .call{display:flex;align-items:center;gap:2cqw;flex-wrap:wrap}
  .call .tag{
    font-weight:700;font-size:2.2cqw;letter-spacing:.2em;line-height:1;
    padding:.9cqw 1.2cqw .9cqw 1.5cqw;background:var(--rust);color:#fff6ee;
  }
  .call p{font-weight:500;font-size:2.4cqw;letter-spacing:.08em;white-space:nowrap}
  .call p span{color:var(--ink-3);margin:0 .4em}

  .date{margin-top:2.6cqw;display:flex;align-items:center;gap:2.4cqw}
  .date strong{font-family:var(--sans);font-weight:500;font-size:5.8cqw;letter-spacing:.02em;line-height:1;white-space:nowrap}
  .date strong i{font-style:normal;font-weight:300;color:var(--rust-2);margin:0 .28em}
  .date p{white-space:nowrap;border-left:1px solid var(--hair);padding-left:2cqw;font-size:1.9cqw;letter-spacing:.2em;line-height:1.55;color:var(--ink-2)}
  .date p small{display:block;font-family:var(--sans);font-size:1.3cqw;letter-spacing:.3em;color:var(--ink-3)}

  .details{margin-top:2.6cqw;display:flex;gap:4.4cqw;font-size:2.6cqw;letter-spacing:.08em;line-height:1.3}
  .details span{font-size:1.9cqw;font-weight:500;letter-spacing:.2em;color:var(--rust-2);margin-right:1.2cqw}
  .details .num{font-family:var(--sans);font-weight:500}
  .details small{font-size:1.8cqw;color:var(--ink-3);margin-left:.6em}

  .credits{
    width:64cqw;margin-top:3cqw;padding-top:2cqw;border-top:1px solid var(--hair);
    font-size:1.35cqw;letter-spacing:.12em;line-height:1.75;color:var(--ink-3);
  }
  .credits b{font-weight:500;color:var(--ink-2);margin-right:.6em}
  .credits .sep{margin:0 1em;opacity:.5}

  /* ===== 右下：QR ===== */
  .apply{right:4cqw;bottom:4.6cqw;display:flex;align-items:flex-end;gap:1.8cqw}
  .apply p{text-align:right;font-weight:700;font-size:1.9cqw;letter-spacing:.24em;line-height:1.5;margin-bottom:-.3cqw}
  .apply p small{display:block;font-family:var(--sans);font-weight:500;font-size:1.2cqw;letter-spacing:.28em;color:var(--ink-3)}
  .qr{width:9.6cqw;aspect-ratio:1;padding:.8cqw;background:#f2ece2;border-radius:.4cqw}
  .qr svg,.qr img{display:block;width:100%;height:100%}
</style>
</head>
<body>
<main class="poster">
  <img class="bg" src="https://raw.githubusercontent.com/ntutee/ares-poster/main/素材/底圖.webp" alt="">
  <div class="shade"></div>
  <div class="grain"></div>

  <!-- 左上：品牌 -->
  <header class="brand">
    <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <circle cx="24" cy="24" r="22.5" stroke="rgba(241,234,223,.5)"/>
      <ellipse cx="24" cy="24" rx="22.5" ry="8" stroke="rgba(241,234,223,.25)" transform="rotate(-24 24 24)"/>
      <circle cx="24" cy="24" r="6" fill="#c8462e"/>
      <circle cx="44.2" cy="15" r="1.6" fill="#f1eadf"/>
    </svg>
    <i class="rule"></i>
    <div>
      <b>NTUT EE</b>
      <span>國立臺北科技大學 電機工程系</span>
    </div>
  </header>

  <!-- 主視覺 -->
  <section class="hero">
    <p class="kicker"><b>2027</b>北科電機冬令營<small>NTUT EE CAMP</small></p>
    <h1><span>絕地</span><span>救援</span></h1>
    <div class="codename">
      <strong>赤境計畫</strong>
      <i></i>
      <em>PROJECT ARES</em>
    </div>
  </section>

  <!-- 彩蛋：基地 -->
  <div class="ares">
    <b>ARES-1</b>
    <span>Communication lost</span>
  </div>

  <!-- 上映資訊帶 -->
  <section class="release">
    <div class="call">
      <span class="tag">赤境救援先鋒隊 招募中</span>
      <p>全國高中職學生<span>／</span>限額 100 名</p>
    </div>

    <div class="date">
      <strong>2027.01.25<i>—</i>01.29</strong>
      <p>五天四夜<small>MON — FRI</small></p>
    </div>

    <div class="details">
      <p><span>地點</span>國立臺北科技大學</p>
      <p><span>報名</span><b class="num">11.01 — 11.21</b><small>第一階段</small></p>
    </div>

    <div class="credits">
      <b>主辦</b>國立臺北科技大學電機工程系・電機工程系學會<br>
      <b>洽詢</b>ntuteecamp11@gmail.com
    </div>
  </section>

  <!-- 右下：QR -->
  <aside class="apply">
    <p>掃描報名<small>SCAN TO APPLY</small></p>
    <div class="qr">
      <!-- QR 佔位圖：請換成 <img src="qr.png" alt="報名 QR Code"> -->
      <svg viewBox="0 0 21 21" shape-rendering="crispEdges" aria-label="報名 QR Code">
        <g fill="#140c0a"><path d="M0 0h7v7H0zM14 0h7v7h-7zM0 14h7v7H0z"/></g>
        <g fill="#f2ece2"><path d="M1 1h5v5H1zM15 1h5v5h-5zM1 15h5v5H1z"/></g>
        <g fill="#140c0a">
          <path d="M2 2h3v3H2zM16 2h3v3h-3zM2 16h3v3H2z"/>
          <path d="M8 0h1v1H8zM10 1h2v1h-2zM9 3h1v2H9zM11 4h2v1h-2zM8 6h1v1H8zM10 6h1v1h-1zM12 6h1v1h-1zM0 8h1v1H0zM2 8h3v1H2zM6 8h2v1H6zM9 8h1v2H9zM12 8h2v1h-2zM15 8h1v1h-1zM17 8h2v1h-2zM20 8h1v2h-1zM1 10h2v1H1zM4 10h1v2H4zM7 10h1v1H7zM11 10h3v1h-3zM16 10h1v2h-1zM18 10h1v1h-1zM0 12h1v1H0zM6 12h3v1H6zM10 12h1v2h-1zM13 12h2v1h-2zM18 12h2v1h-2zM8 14h1v1H8zM12 14h1v1h-1zM14 14h3v1h-3zM19 14h2v1h-2zM9 16h2v1H9zM13 16h1v2h-1zM15 16h1v1h-1zM18 16h1v2h-1zM8 18h1v2H8zM10 18h2v1h-2zM15 18h2v1h-2zM20 18h1v1h-1zM11 20h1v1h-1zM13 20h2v1h-2zM17 20h2v1h-2z"/>
        </g>
      </svg>
    </div>
  </aside>
</main>
</body>
</html>
